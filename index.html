<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Croquis Estructural 3D</title>
  <style>
    :root {
      --bg-canvas: #141619;
      --bg-panel: rgba(28, 31, 36, 0.90);
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --border-panel: rgba(255, 255, 255, 0.12);
      --btn-bg: rgba(255, 255, 255, 0.06);
      --btn-border: rgba(255, 255, 255, 0.1);
      --shadow-panel: 0 8px 24px rgba(0, 0, 0, 0.45);
    }
    body.light-mode {
      --bg-canvas: #f4f1ea;
      --bg-panel: rgba(255, 255, 255, 0.92);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-panel: rgba(15, 23, 42, 0.12);
      --btn-bg: rgba(15, 23, 42, 0.05);
      --btn-border: rgba(15, 23, 42, 0.12);
      --shadow-panel: 0 8px 24px rgba(15, 23, 42, 0.12);
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-canvas);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Menú Lateral Izquierdo */
    #sidebar {
      position: absolute;
      top: 14px;
      left: 14px;
      max-height: calc(100vh - 28px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 11px;
      border-radius: 16px;
      border: 1px solid var(--border-panel);
      box-shadow: var(--shadow-panel);
      z-index: 10;
      width: 186px;
    }
    .menu-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin: 3px 0 1px 2px;
      font-weight: 700;
    }
    button {
      background: var(--btn-bg);
      color: var(--text-main);
      border: 1px solid var(--btn-border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12.5px;
      font-weight: 600;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    button:active {
      transform: scale(0.97);
    }
    button.active {
      background: #3b82f6;
      color: #ffffff;
      border-color: #60a5fa;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.35);
    }
    button.secondary-active {
      background: #10b981;
      color: #ffffff;
      border-color: #34d399;
    }
    button.danger {
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.25);
    }
    .divider {
      height: 1px;
      background: var(--border-panel);
      margin: 3px 0;
    }

    /* Submenú de estilos de Hatch */
    #hatch-options {
      display: none;
      flex-direction: column;
      gap: 5px;
      padding: 6px;
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 10px;
    }
    #hatch-options.visible {
      display: flex;
    }
    .hatch-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }
    .hatch-style-btn {
      padding: 6px 6px;
      font-size: 11px;
      justify-content: center;
      text-align: center;
    }

    /* Selector de paso de imán */
    .snap-step-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 2px 0;
    }
    .snap-step-btn {
      padding: 5px 4px;
      font-size: 11px;
      justify-content: center;
      text-align: center;
    }

    /* Paleta de Colores */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 2px 0;
    }
    .color-swatch {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      padding: 0;
      transition: transform 0.12s ease;
    }
    .color-swatch.active {
      border-color: #3b82f6;
      transform: scale(1.1);
      box-shadow: 0 0 0 2px var(--bg-panel);
    }
    #custom-color {
      width: 100%;
      height: 28px;
      border: 1px solid var(--btn-border);
      border-radius: 8px;
      background: transparent;
      padding: 0;
      cursor: pointer;
    }

    /* Controles deslizantes */
    .slider-box {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 3px 2px;
      font-size: 11px;
      color: var(--text-muted);
    }
    #eraser-size-box {
      display: none;
    }
    #eraser-size-box.visible {
      display: flex;
    }

    /* Panel Inferior para mover el Plano de Dibujo 3D */
    #plane-panel {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 9px 15px;
      border-radius: 14px;
      border: 1px solid var(--border-panel);
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-main);
      font-size: 13px;
      z-index: 10;
      box-shadow: var(--shadow-panel);
      white-space: nowrap;
    }
    .plane-btn {
      padding: 7px 11px;
      font-size: 12px;
    }
    input[type="range"] {
      width: 130px;
      accent-color: #3b82f6;
    }
    #plane-val {
      min-width: 46px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: #3b82f6;
    }

    /* Barra superior derecha */
    #top-right-bar {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }
    .top-pill {
      background: var(--bg-panel);
      color: var(--text-main);
      padding: 9px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border-panel);
      box-shadow: var(--shadow-panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* Cursor circular visual del Borrador */
    #eraser-cursor {
      position: fixed;
      pointer-events: none;
      border: 2px solid #ef4444;
      background: rgba(239, 68, 68, 0.18);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 25;
    }

    /* Modal de Guardar / Abrir Proyectos */
    #modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    #modal-overlay.open {
      display: flex;
    }
    .modal-card {
      background: var(--bg-panel);
      color: var(--text-main);
      border: 1px solid var(--border-panel);
      border-radius: 18px;
      width: 92%;
      max-width: 450px;
      padding: 20px;
      box-shadow: var(--shadow-panel);
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 85vh;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: 700;
    }
    .save-row {
      display: flex;
      gap: 8px;
    }
    .save-row input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--text-main);
      font-size: 14px;
      -webkit-user-select: text;
      user-select: text;
    }
    #project-list {
      overflow-y: auto;
      max-height: 210px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .project-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      font-size: 13px;
    }
    .project-actions {
      display: flex;
      gap: 6px;
    }
    .export-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .export-row button {
      justify-content: center;
      text-align: center;
    }
  </style>
  <!-- Three.js y OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Cursor visual para el borrador -->
  <div id="eraser-cursor"></div>

  <!-- Barra Superior Derecha -->
  <div id="top-right-bar">
    <button id="btn-projects" class="top-pill">💾 Proyectos</button>
    <button id="btn-theme" class="top-pill" title="Cambiar modo Claro / Oscuro">☀️ Claro</button>
  </div>

  <!-- Menú Lateral Izquierdo -->
  <div id="sidebar">
    <div class="menu-label">Herramienta</div>
    <button id="btn-pencil" class="active">✏️ Lápiz Boceto</button>
    <button id="btn-pen">✒️ Pluma Tinta</button>
    <button id="btn-rect-hatch">🧱 Muro / Hatch</button>
    <button id="btn-poly-hatch">▱ Polígono Hatch</button>

    <!-- Opciones desplegables de Hatch -->
    <div id="hatch-options">
      <span style="font-size:10px; font-weight:700; color:var(--text-muted);">ESTILO DE RELLENO:</span>
      <div class="hatch-grid">
        <button class="hatch-style-btn active" data-hmode="diag">/// Diag</button>
        <button class="hatch-style-btn" data-hmode="cross">XXX Cruz</button>
        <button class="hatch-style-btn" data-hmode="mixed">▤ Mixto</button>
        <button class="hatch-style-btn" data-hmode="solid">▓ Sólido</button>
      </div>
      <div class="slider-box">
        <span>Separación: <b id="hatch-space-lbl">0.25 m</b></span>
        <input type="range" id="hatch-space-slider" min="0.12" max="0.60" step="0.04" value="0.25" style="width:100%;">
      </div>
    </div>

    <button id="btn-eraser">🧹 Borrador Lápiz</button>
    <div id="eraser-size-box" class="slider-box">
      <span>Radio borrador: <b id="eraser-lbl">22 px</b></span>
      <input type="range" id="eraser-slider" min="10" max="55" step="2" value="22" style="width:100%;">
    </div>

    <button id="btn-orbit">🔄 Rotar Cámara</button>

    <!-- Grosor de Lápiz / Pluma -->
    <div id="stroke-size-box" class="slider-box">
      <span>Grosor Trazo: <b id="stroke-size-lbl">1.0x</b></span>
      <input type="range" id="stroke-size-slider" min="0.4" max="3.5" step="0.2" value="1.0" style="width:100%;">
    </div>

    <div class="divider"></div>
    <div class="menu-label">Color de Línea</div>
    <div class="color-grid" id="color-palette">
      <button class="color-swatch active" data-color="#e2e8f0" style="background:#e2e8f0;" title="Tiza / Grafito Claro"></button>
      <button class="color-swatch" data-color="#1e293b" style="background:#1e293b;" title="Grafito Oscuro / Tinta"></button>
      <button class="color-swatch" data-color="#38bdf8" style="background:#38bdf8;" title="Azul Arquitectónico"></button>
      <button class="color-swatch" data-color="#ef4444" style="background:#ef4444;" title="Rojo Estructural"></button>
      <button class="color-swatch" data-color="#10b981" style="background:#10b981;" title="Verde Ejes"></button>
      <button class="color-swatch" data-color="#f59e0b" style="background:#f59e0b;" title="Ámbar Cimentación"></button>
      <button class="color-swatch" data-color="#a855f7" style="background:#a855f7;" title="Violeta"></button>
      <input type="color" id="custom-color" value="#38bdf8" title="Color personalizado">
    </div>

    <div class="divider"></div>
    <div class="menu-label">Asistencia y Grilla</div>
    <button id="btn-straight">📏 Línea Recta</button>
    <button id="btn-snap" class="secondary-active">🧲 Imán a Grilla</button>
    <div id="snap-step-box" class="slider-box">
      <span>Paso del Imán:</span>
      <div class="snap-step-row">
        <button class="snap-step-btn" data-step="0.25">0.25m</button>
        <button class="snap-step-btn secondary-active" data-step="0.5">0.50m</button>
        <button class="snap-step-btn" data-step="1.0">1.0m</button>
      </div>
    </div>
    <div class="slider-box">
      <span>Tamaño Grilla: <b id="grid-size-lbl">20x20 m</b></span>
      <input type="range" id="grid-size-slider" min="10" max="80" step="10" value="20" style="width:100%;">
    </div>

    <div class="divider"></div>
    <div class="menu-label">Edición</div>
    <button id="btn-undo">↩️ Deshacer</button>
    <button id="btn-clear" class="danger">🗑️ Borrar Todo</button>
  </div>

  <!-- Selector de Plano Estructural 3D -->
  <div id="plane-panel">
    <span style="font-weight:600; color:var(--text-muted);">Plano:</span>
    <button id="pl-xz" class="plane-btn active">Planta (Losa)</button>
    <button id="pl-xy" class="plane-btn">Marco X</button>
    <button id="pl-yz" class="plane-btn">Marco Z</button>
    <span style="margin-left:4px; color:var(--text-muted);">Nivel:</span>
    <input type="range" id="plane-slider" min="-10" max="10" step="0.5" value="0">
    <span id="plane-val">0.0 m</span>
  </div>

  <!-- Modal de Proyectos (Guardar / Cargar / Exportar) -->
  <div id="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <span>💾 Mis Proyectos en este iPad</span>
        <button id="btn-close-modal" style="padding:6px 10px;">✕</button>
      </div>

      <div style="font-size:12px; color:var(--text-muted); display:flex; justify-content:space-between;">
        <span>Dibujo actual en escena:</span>
        <b id="current-weight-lbl" style="color:#10b981;">Ligero ⚡</b>
      </div>

      <div class="save-row">
        <input type="text" id="project-name-input" placeholder="Nombre (ej. Casa Morelia)">
        <button id="btn-save-project" class="active">Guardar</button>
      </div>

      <div class="menu-label">Proyectos Guardados</div>
      <div id="project-list"></div>

      <div class="divider"></div>
      <div class="menu-label">Archivos y Captura</div>
      <div class="export-row">
        <button id="btn-export-json">📥 Bajar Archivo</button>
        <button id="btn-import-json">📤 Abrir Archivo</button>
        <button id="btn-export-png" style="grid-column: span 2;">📸 Guardar Imagen PNG</button>
      </div>
      <input type="file" id="file-input" accept=".json" style="display:none;">
    </div>
  </div>

  <div id="canvas-container"></div>

  <script>
    // --- CONFIGURACIÓN DE ESCENA ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    let isLightMode = false;
    scene.background = new THREE.Color(0x141619);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(14, 12, 16);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0, 2, 0);

    // Cuadrícula Base del Suelo
    let currentGridSize = 20;
    let floorGrid = new THREE.GridHelper(24, 24, 0x3b82f6, 0x262930);
    scene.add(floorGrid);

    const axesHelper = new THREE.AxesHelper(3);
    axesHelper.position.set(-12, 0.01, -12);
    scene.add(axesHelper);

    // --- PLANO DE TRABAJO ACTIVO ---
    let currentPlaneType = 'XZ';
    let planeOffset = 0;
    const mathPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

    const activeGridGroup = new THREE.Group();
    let activeGrid = new THREE.GridHelper(20, 20, 0x60a5fa, 0x334155);
    activeGrid.material.transparent = true;
    activeGrid.material.opacity = 0.45;

    const planeGeo = new THREE.PlaneGeometry(20, 20);
    planeGeo.rotateX(-Math.PI / 2);
    const planeMat = new THREE.MeshBasicMaterial({
      color: 0x3b82f6,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.04,
      depthWrite: false
    });
    const activePlaneMesh = new THREE.Mesh(planeGeo, planeMat);
    activeGridGroup.add(activeGrid);
    activeGridGroup.add(activePlaneMesh);
    scene.add(activeGridGroup);

    // Indicador visual 3D del Imán a Grilla / Vértices
    const snapMarker = new THREE.Group();
    const ringGeo = new THREE.RingGeometry(0.08, 0.14, 24);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x10b981, side: THREE.DoubleSide, depthTest: false });
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    const dotGeo = new THREE.SphereGeometry(0.045, 12, 12);
    const dotMat = new THREE.MeshBasicMaterial({ color: 0x34d399, depthTest: false });
    snapMarker.add(ringMesh);
    snapMarker.add(new THREE.Mesh(dotGeo, dotMat));
    snapMarker.visible = false;
    scene.add(snapMarker);

    function updateWorkingPlane() {
      activeGridGroup.position.set(0, 0, 0);
      activeGridGroup.rotation.set(0, 0, 0);
      ringMesh.rotation.set(0, 0, 0);

      if (currentPlaneType === 'XZ') {
        mathPlane.set(new THREE.Vector3(0, 1, 0), -planeOffset);
        activeGridGroup.position.y = planeOffset;
        ringMesh.rotation.x = -Math.PI / 2;
      } else if (currentPlaneType === 'XY') {
        mathPlane.set(new THREE.Vector3(0, 0, 1), -planeOffset);
        activeGridGroup.rotation.x = Math.PI / 2;
        activeGridGroup.position.z = planeOffset;
      } else if (currentPlaneType === 'YZ') {
        mathPlane.set(new THREE.Vector3(1, 0, 0), -planeOffset);
        activeGridGroup.rotation.z = Math.PI / 2;
        activeGridGroup.position.x = planeOffset;
        ringMesh.rotation.y = Math.PI / 2;
      }
      snapMarker.visible = false;
    }
    updateWorkingPlane();

    // --- ESTADO GLOBAL Y OPCIONES ---
    let tool = 'pencil'; // 'pencil' | 'pen' | 'rect-hatch' | 'poly-hatch' | 'eraser' | 'orbit'
    let currentColor = '#e2e8f0';
    let currentStrokeSize = 1.0;
    let hatchMode = 'diag';
    let hatchSpacing = 0.25;
    let straightMode = false;
    let snapToGrid = true;
    let snapStep = 0.5; // Paso por defecto: 0.50m (coincide con la grilla de 1m y mitades)
    let eraserRadiusPx = 22;

    let strokesData = [];
    const undoStack = [];
    const MAX_UNDO = 30;

    const round2 = (n) => Math.round(n * 100) / 100;

    function simplifyPoints(pts) {
      if (!pts || pts.length <= 2) return pts;
      const out = [pts[0]];
      for (let i = 1; i < pts.length - 1; i++) {
        const prev = out[out.length - 1];
        const curr = pts[i];
        const next = pts[i + 1];

        const dx1 = curr.x - prev.x, dy1 = curr.y - prev.y, dz1 = curr.z - prev.z;
        const len1Sq = dx1*dx1 + dy1*dy1 + dz1*dz1;
        if (len1Sq < 0.0016) continue;

        const dx2 = next.x - curr.x, dy2 = next.y - curr.y, dz2 = next.z - curr.z;
        const len2Sq = dx2*dx2 + dy2*dy2 + dz2*dz2;
        if (len2Sq > 0.00001) {
          const cx = dy1 * dz2 - dz1 * dy2;
          const cy = dz1 * dx2 - dx1 * dz2;
          const cz = dx1 * dy2 - dy1 * dx2;
          const areaSq = cx*cx + cy*cy + cz*cz;
          if (areaSq / (len1Sq * len2Sq) < 0.0012) {
            continue;
          }
        }
        out.push(curr);
      }
      out.push(pts[pts.length - 1]);
      return out;
    }

    function serializeStrokes() {
      const compact = strokesData.map(s => {
        if (s.type === 'fill') {
          return {
            t: 'f',
            c: s.color,
            pt: s.planeType,
            po: round2(s.planeOffset),
            p2: s.poly2D.map(uv => [round2(uv[0]), round2(uv[1])])
          };
        }
        const simplified = simplifyPoints(s.points);
        return {
          s: s.style === 'pen' ? 1 : 0,
          c: s.color,
          sz: round2(s.size || 1),
          n: [round2(s.normal.x), round2(s.normal.y), round2(s.normal.z)],
          p: simplified.map(pt => [round2(pt.x), round2(pt.y), round2(pt.z), round2(pt.pressure || 0.55)])
        };
      });
      return JSON.stringify(compact);
    }

    function pushUndoState() {
      undoStack.push([...strokesData]);
      if (undoStack.length > MAX_UNDO) undoStack.shift();
    }

    let saveTimeout = null;
    function autoSaveLocal() {
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        try {
          localStorage.setItem('croquis3d_autosave', serializeStrokes());
        } catch (err) {}
      }, 350);
    }

    // --- CONSTRUCCIÓN VISUAL DEL TRAZO ---
    function interpolateForVisuals(rawPts, isPencil) {
      if (!rawPts || rawPts.length < 2) return [];
      const result = [];
      const visualStep = isPencil ? 0.22 : 0.35;

      for (let i = 0; i < rawPts.length - 1; i++) {
        const a = rawPts[i];
        const b = rawPts[i + 1];
        const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
        const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
        const steps = Math.max(1, Math.min(80, Math.ceil(dist / visualStep)));

        for (let s = 0; s < steps; s++) {
          const t = s / steps;
          result.push({
            x: a.x + dx * t,
            y: a.y + dy * t,
            z: a.z + dz * t,
            pressure: THREE.MathUtils.lerp(a.pressure || 0.55, b.pressure || 0.55, t)
          });
        }
      }
      const last = rawPts[rawPts.length - 1];
      result.push({ x: last.x, y: last.y, z: last.z, pressure: last.pressure || 0.55 });
      return result;
    }

    function createStrokeMesh(strokeObj) {
      const group = new THREE.Group();
      const rawPts = strokeObj.points;
      if (!rawPts || rawPts.length < 2) return group;

      const isPencil = (strokeObj.style !== 'pen');
      const pts = interpolateForVisuals(rawPts, isPencil);
      const colorVal = new THREE.Color(strokeObj.color || '#e2e8f0');
      const sizeMult = strokeObj.size || 1.0;
      const baseWidth = (isPencil ? 0.062 : 0.088) * sizeMult;
      const planeNormal = new THREE.Vector3(
        strokeObj.normal.x,
        strokeObj.normal.y,
        strokeObj.normal.z
      );

      const positions = [];
      for (let i = 0; i < pts.length; i++) {
        const curr = new THREE.Vector3(pts[i].x, pts[i].y, pts[i].z);
        const next = (i < pts.length - 1) ? new THREE.Vector3(pts[i+1].x, pts[i+1].y, pts[i+1].z) : curr;
        const prev = (i > 0) ? new THREE.Vector3(pts[i-1].x, pts[i-1].y, pts[i-1].z) : curr;

        let tangent = next.clone().sub(prev);
        if (tangent.lengthSq() < 0.00001) tangent.set(1, 0, 0);
        tangent.normalize();

        let perp = new THREE.Vector3().crossVectors(tangent, planeNormal);
        if (perp.lengthSq() < 0.0001) perp.set(0, 1, 0);
        perp.normalize();

        const jitter = isPencil ? (Math.sin(i * 1.9) * 0.008 * Math.min(1.4, sizeMult)) : 0;
        const halfW = (baseWidth * (0.4 + pts[i].pressure * 0.9)) * 0.5;

        const left = curr.clone().addScaledVector(perp, halfW + jitter);
        const right = curr.clone().addScaledVector(perp, -halfW + jitter);

        positions.push(left.x, left.y, left.z, right.x, right.y, right.z);
      }

      const indices = [];
      for (let i = 0; i < pts.length - 1; i++) {
        const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2, d = (i + 1) * 2 + 1;
        indices.push(a, b, c, b, d, c);
      }

      const ribbonGeo = new THREE.BufferGeometry();
      ribbonGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      ribbonGeo.setIndex(indices);

      const ribbonMat = new THREE.MeshBasicMaterial({
        color: colorVal,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: isPencil ? 0.76 : 0.96
      });
      group.add(new THREE.Mesh(ribbonGeo, ribbonMat));

      const strandCount = isPencil ? 2 : 1;
      const spread = (isPencil ? 0.03 : 0.008) * Math.min(1.5, sizeMult);
      for (let s = 0; s < strandCount; s++) {
        const strandPts = [];
        for (let i = 0; i < pts.length; i++) {
          const p = pts[i];
          const hash = Math.sin((i + 1) * 12.9898 + (s + 1) * 78.233) * 43758.5453;
          const rand = (hash - Math.floor(hash)) - 0.5;
          strandPts.push(new THREE.Vector3(
            p.x + rand * spread,
            p.y + Math.cos(i * 1.3 + s) * spread * 0.4,
            p.z + Math.sin(i * 1.7 - s) * spread * 0.5
          ));
        }
        const lineGeo = new THREE.BufferGeometry().setFromPoints(strandPts);
        const lineMat = new THREE.LineBasicMaterial({
          color: colorVal,
          transparent: true,
          opacity: isPencil ? 0.35 : 0.45
        });
        group.add(new THREE.Line(lineGeo, lineMat));
      }

      return group;
    }

    // --- CONVERSIÓN 2D <-> 3D EN EL PLANO ACTIVO Y GENERADOR DE HATCH ---
    function toPlane2D(vec3, pType) {
      if (pType === 'XZ') return [vec3.x, vec3.z];
      if (pType === 'XY') return [vec3.x, vec3.y];
      return [vec3.z, vec3.y];
    }

    function fromPlane2D(u, v, pType, offset) {
      if (pType === 'XZ') return new THREE.Vector3(u, offset, v);
      if (pType === 'XY') return new THREE.Vector3(u, v, offset);
      return new THREE.Vector3(offset, v, u);
    }

    function getPlaneNormalObj(pType) {
      if (pType === 'XZ') return { x: 0, y: 1, z: 0 };
      if (pType === 'XY') return { x: 0, y: 0, z: 1 };
      return { x: 1, y: 0, z: 0 };
    }

    function createFillMesh(fillObj) {
      const poly = fillObj.poly2D;
      if (!poly || poly.length < 3) return new THREE.Group();
      const shape = new THREE.Shape();
      shape.moveTo(poly[0][0], poly[0][1]);
      for (let i = 1; i < poly.length; i++) {
        shape.lineTo(poly[i][0], poly[i][1]);
      }
      shape.closePath();

      const geom = new THREE.ShapeGeometry(shape);
      const posAttr = geom.attributes.position;
      for (let i = 0; i < posAttr.count; i++) {
        const u = posAttr.getX(i);
        const v = posAttr.getY(i);
        const p3 = fromPlane2D(u, v, fillObj.planeType, fillObj.planeOffset);
        posAttr.setXYZ(i, p3.x, p3.y, p3.z);
      }
      posAttr.needsUpdate = true;
      geom.computeVertexNormals();

      const mat = new THREE.MeshBasicMaterial({
        color: new THREE.Color(fillObj.color || '#e2e8f0'),
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.22,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: 1,
        polygonOffsetUnits: 1
      });
      const group = new THREE.Group();
      group.add(new THREE.Mesh(geom, mat));
      return group;
    }

    function computeHatchSegments2D(poly2D, spacing, angleRad) {
      if (poly2D.length < 3) return [];
      const cosA = Math.cos(-angleRad);
      const sinA = Math.sin(-angleRad);
      const cosInv = Math.cos(angleRad);
      const sinInv = Math.sin(angleRad);

      const rotPoly = poly2D.map(([u, v]) => [
        u * cosA - v * sinA,
        u * sinA + v * cosA
      ]);

      let minV = Infinity, maxV = -Infinity;
      for (let i = 0; i < rotPoly.length; i++) {
        if (rotPoly[i][1] < minV) minV = rotPoly[i][1];
        if (rotPoly[i][1] > maxV) maxV = rotPoly[i][1];
      }

      const segments = [];
      const startY = Math.ceil(minV / spacing) * spacing;
      for (let y = startY; y <= maxV; y += spacing) {
        const xHits = [];
        for (let i = 0; i < rotPoly.length; i++) {
          const p1 = rotPoly[i];
          const p2 = rotPoly[(i + 1) % rotPoly.length];
          if ((p1[1] <= y && p2[1] > y) || (p2[1] <= y && p1[1] > y)) {
            const t = (y - p1[1]) / (p2[1] - p1[1]);
            xHits.push(p1[0] + t * (p2[0] - p1[0]));
          }
        }
        xHits.sort((a, b) => a - b);
        for (let k = 0; k + 1 < xHits.length; k += 2) {
          const x1 = xHits[k], x2 = xHits[k + 1];
          if (Math.abs(x2 - x1) < 0.03) continue;
          const u1 = x1 * cosInv - y * sinInv;
          const v1 = x1 * sinInv + y * cosInv;
          const u2 = x2 * cosInv - y * sinInv;
          const v2 = x2 * sinInv + y * cosInv;
          segments.push([[u1, v1], [u2, v2]]);
        }
      }
      return segments;
    }

    function buildHatchElements(poly2D, pType, pOffset, hMode, spacing, color, size) {
      const elements = [];
      if (poly2D.length < 3) return elements;
      const normal = getPlaneNormalObj(pType);

      if (hMode === 'mixed' || hMode === 'solid') {
        elements.push({
          type: 'fill',
          color,
          planeType: pType,
          planeOffset: pOffset,
          poly2D: poly2D.map(uv => [...uv])
        });
      }

      for (let i = 0; i < poly2D.length; i++) {
        const a2 = poly2D[i];
        const b2 = poly2D[(i + 1) % poly2D.length];
        const va = fromPlane2D(a2[0], a2[1], pType, pOffset);
        const vb = fromPlane2D(b2[0], b2[1], pType, pOffset);
        if (va.distanceToSquared(vb) < 0.0004) continue;

        elements.push({
          type: 'stroke',
          style: 'pencil',
          color,
          size: size,
          normal,
          points: [
            { x: va.x, y: va.y, z: va.z, pressure: 0.65 },
            { x: vb.x, y: vb.y, z: vb.z, pressure: 0.65 }
          ]
        });
      }

      if (hMode !== 'solid') {
        const segs45 = computeHatchSegments2D(poly2D, spacing, Math.PI / 4);
        const allSegs = (hMode === 'cross')
          ? segs45.concat(computeHatchSegments2D(poly2D, spacing, -Math.PI / 4))
          : segs45;

        const hatchStrokeSize = Math.max(0.35, size * 0.65);
        allSegs.forEach(seg => {
          const p1 = fromPlane2D(seg[0][0], seg[0][1], pType, pOffset);
          const p2 = fromPlane2D(seg[1][0], seg[1][1], pType, pOffset);
          elements.push({
            type: 'stroke',
            style: 'pencil',
            color,
            size: hatchStrokeSize,
            normal,
            points: [
              { x: p1.x, y: p1.y, z: p1.z, pressure: 0.45 },
              { x: p2.x, y: p2.y, z: p2.z, pressure: 0.45 }
            ]
          });
        });
      }

      return elements;
    }

    function rebuildAllMeshesFromData(parsedArray) {
      strokesData.forEach(s => { if (s.mesh) scene.remove(s.mesh); });
      strokesData = [];
      if (!Array.isArray(parsedArray)) return;

      parsedArray.forEach(item => {
        if (item.t === 'f' || item.type === 'fill') {
          const fillObj = {
            type: 'fill',
            color: item.c || item.color || '#e2e8f0',
            planeType: item.pt || item.planeType || 'XZ',
            planeOffset: item.po ?? item.planeOffset ?? 0,
            poly2D: item.p2 || item.poly2D || [],
            mesh: null
          };
          if (fillObj.poly2D.length >= 3) {
            fillObj.mesh = createFillMesh(fillObj);
            scene.add(fillObj.mesh);
            strokesData.push(fillObj);
          }
          return;
        }

        let pts = [];
        if (item.p && Array.isArray(item.p)) {
          pts = item.p.map(arr => ({ x: arr[0], y: arr[1], z: arr[2], pressure: arr[3] ?? 0.55 }));
        } else if (item.points && Array.isArray(item.points)) {
          pts = simplifyPoints(item.points);
        }
        if (pts.length < 2) return;

        const norm = item.n
          ? { x: item.n[0], y: item.n[1], z: item.n[2] }
          : (item.normal || { x: 0, y: 1, z: 0 });

        const strokeObj = {
          type: 'stroke',
          style: (item.s === 1 || item.style === 'pen') ? 'pen' : 'pencil',
          color: item.c || item.color || '#e2e8f0',
          size: item.sz || item.size || 1.0,
          normal: norm,
          points: pts,
          mesh: null
        };
        strokeObj.mesh = createStrokeMesh(strokeObj);
        scene.add(strokeObj.mesh);
        strokesData.push(strokeObj);
      });
    }

    function syncSceneWithStrokesArray(newArray) {
      strokesData.forEach(s => { if (s.mesh) scene.remove(s.mesh); });
      strokesData = newArray;
      strokesData.forEach(s => {
        if (!s.mesh) {
          s.mesh = (s.type === 'fill') ? createFillMesh(s) : createStrokeMesh(s);
        }
        scene.add(s.mesh);
      });
    }

    // --- LÁPIZ BORRADOR PARCIAL INTELIGENTE ---
    const projVec = new THREE.Vector3();
    function eraseAtScreenPoint(clientX, clientY) {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const rSq = eraserRadiusPx * eraserRadiusPx;
      let anyModified = false;
      const nextStrokes = [];

      for (let sIdx = 0; sIdx < strokesData.length; sIdx++) {
        const stroke = strokesData[sIdx];

        if (stroke.type === 'fill') {
          let hitFill = false;
          const poly = stroke.poly2D;
          let cu = 0, cv = 0;
          for (let i = 0; i < poly.length; i++) {
            cu += poly[i][0]; cv += poly[i][1];
            const p3 = fromPlane2D(poly[i][0], poly[i][1], stroke.planeType, stroke.planeOffset);
            projVec.copy(p3).project(camera);
            const sx = (projVec.x * 0.5 + 0.5) * width;
            const sy = (-projVec.y * 0.5 + 0.5) * height;
            if ((sx - clientX)**2 + (sy - clientY)**2 <= rSq * 1.5) hitFill = true;
          }
          const center3 = fromPlane2D(cu / poly.length, cv / poly.length, stroke.planeType, stroke.planeOffset);
          projVec.copy(center3).project(camera);
          const csx = (projVec.x * 0.5 + 0.5) * width;
          const csy = (-projVec.y * 0.5 + 0.5) * height;
          if ((csx - clientX)**2 + (csy - clientY)**2 <= rSq * 2.2) hitFill = true;

          if (hitFill) {
            anyModified = true;
            scene.remove(stroke.mesh);
          } else {
            nextStrokes.push(stroke);
          }
          continue;
        }

        const densePts = interpolateForVisuals(stroke.points, true);
        let strokeHit = false;
        const keepFlags = new Array(densePts.length).fill(true);

        for (let i = 0; i < densePts.length; i++) {
          projVec.set(densePts[i].x, densePts[i].y, densePts[i].z).project(camera);
          if (projVec.z < -1 || projVec.z > 1) continue;
          const sx = (projVec.x * 0.5 + 0.5) * width;
          const sy = (-projVec.y * 0.5 + 0.5) * height;
          const dx = sx - clientX;
          const dy = sy - clientY;
          if (dx * dx + dy * dy <= rSq) {
            keepFlags[i] = false;
            strokeHit = true;
          }
        }

        if (!strokeHit) {
          nextStrokes.push(stroke);
        } else {
          anyModified = true;
          scene.remove(stroke.mesh);

          let currentSegment = [];
          for (let i = 0; i < densePts.length; i++) {
            if (keepFlags[i]) {
              currentSegment.push(densePts[i]);
            } else {
              if (currentSegment.length >= 2) {
                const cleanPts = simplifyPoints(currentSegment);
                const newPart = {
                  type: 'stroke',
                  style: stroke.style,
                  color: stroke.color,
                  size: stroke.size,
                  normal: stroke.normal,
                  points: cleanPts,
                  mesh: null
                };
                newPart.mesh = createStrokeMesh(newPart);
                scene.add(newPart.mesh);
                nextStrokes.push(newPart);
              }
              currentSegment = [];
            }
          }
          if (currentSegment.length >= 2) {
            const cleanPts = simplifyPoints(currentSegment);
            const newPart = {
              type: 'stroke',
              style: stroke.style,
              color: stroke.color,
              size: stroke.size,
              normal: stroke.normal,
              points: cleanPts,
              mesh: null
            };
            newPart.mesh = createStrokeMesh(newPart);
            scene.add(newPart.mesh);
            nextStrokes.push(newPart);
          }
        }
      }

      if (anyModified) {
        strokesData = nextStrokes;
      }
      return anyModified;
    }

    // --- MOTOR DE IMÁN A GRILLA Y VÉRTICES EXISTENTES ---
    const raycaster = new THREE.Raycaster();
    const eraserCursor = document.getElementById('eraser-cursor');
    let isInteracting = false;
    let didEraseSomething = false;
    let strokeStartPt = null; // Punto de inicio fijo e inmutable para Línea Recta y Muro
    let rawPoints = [];
    let livePreviewGroup = null;
    let pendingHatchElements = [];
    let activeTouches = 0;

    function snapPointToGridOrVertex(target) {
      // 1. Fijar coordenada exacta del plano activo
      if (currentPlaneType === 'XZ') target.y = planeOffset;
      else if (currentPlaneType === 'XY') target.z = planeOffset;
      else if (currentPlaneType === 'YZ') target.x = planeOffset;

      if (!snapToGrid) {
        snapMarker.visible = false;
        return target;
      }

      // 2. Primero verificar si hay un extremo/esquina ya dibujado muy cerca (Imán a Vértices)
      const vertexSnapDistSq = Math.min(0.28 * 0.28, (snapStep * 0.45) ** 2);
      let bestVertex = null;
      let bestDistSq = vertexSnapDistSq;

      for (let i = 0; i < strokesData.length; i++) {
        const s = strokesData[i];
        if (!s.points || s.points.length < 2) continue;
        const ends = [s.points[0], s.points[s.points.length - 1]];
        for (let k = 0; k < 2; k++) {
          const ep = ends[k];
          const dSq = (ep.x - target.x)**2 + (ep.y - target.y)**2 + (ep.z - target.z)**2;
          if (dSq < bestDistSq) {
            bestDistSq = dSq;
            bestVertex = ep;
          }
        }
      }

      if (bestVertex) {
        target.set(bestVertex.x, bestVertex.y, bestVertex.z);
        snapMarker.position.copy(target);
        snapMarker.visible = true;
        return target;
      }

      // 3. Si no hay esquina previa, redondear a la cuadrícula según el paso elegido (0.25m, 0.50m o 1.0m)
      if (currentPlaneType === 'XZ') {
        target.x = Math.round(target.x / snapStep) * snapStep;
        target.z = Math.round(target.z / snapStep) * snapStep;
        target.y = planeOffset;
      } else if (currentPlaneType === 'XY') {
        target.x = Math.round(target.x / snapStep) * snapStep;
        target.y = Math.round(target.y / snapStep) * snapStep;
        target.z = planeOffset;
      } else if (currentPlaneType === 'YZ') {
        target.y = Math.round(target.y / snapStep) * snapStep;
        target.z = Math.round(target.z / snapStep) * snapStep;
        target.x = planeOffset;
      }

      snapMarker.position.copy(target);
      snapMarker.visible = true;
      return target;
    }

    function get3DPoint(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera({ x, y }, camera);
      const target = new THREE.Vector3();
      const hit = raycaster.ray.intersectPlane(mathPlane, target);
      if (!hit) return null;

      return snapPointToGridOrVertex(target);
    }

    function updateEraserCursor(clientX, clientY, visible) {
      if (!visible) {
        eraserCursor.style.display = 'none';
        return;
      }
      eraserCursor.style.display = 'block';
      eraserCursor.style.width = (eraserRadiusPx * 2) + 'px';
      eraserCursor.style.height = (eraserRadiusPx * 2) + 'px';
      eraserCursor.style.left = clientX + 'px';
      eraserCursor.style.top = clientY + 'px';
    }

    function clearLivePreview() {
      if (livePreviewGroup) {
        scene.remove(livePreviewGroup);
        livePreviewGroup = null;
      }
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'touch') activeTouches++;

      const isPen = (e.pointerType === 'pen');
      if (activeTouches >= 2 || (tool === 'orbit' && !isPen)) {
        isInteracting = false;
        strokeStartPt = null;
        snapMarker.visible = false;
        updateEraserCursor(0, 0, false);
        clearLivePreview();
        controls.enabled = true;
        return;
      }

      controls.enabled = false;
      isInteracting = true;
      pendingHatchElements = [];

      if (tool === 'eraser') {
        snapMarker.visible = false;
        pushUndoState();
        didEraseSomething = eraseAtScreenPoint(e.clientX, e.clientY);
        updateEraserCursor(e.clientX, e.clientY, true);
        return;
      }

      const pt = get3DPoint(e);
      if (!pt) return;
      const pressure = (isPen && e.pressure > 0) ? e.pressure : 0.55;
      // Guardamos el punto inicial de forma fija para que Línea Recta NUNCA se mueva sola
      strokeStartPt = { x: pt.x, y: pt.y, z: pt.z, pressure };
      rawPoints = [{ ...strokeStartPt }];
    });

    renderer.domElement.addEventListener('pointermove', (e) => {
      if (!isInteracting) return;
      if (e.pointerType === 'touch' && activeTouches >= 2) return;

      if (tool === 'eraser') {
        updateEraserCursor(e.clientX, e.clientY, true);
        if (eraseAtScreenPoint(e.clientX, e.clientY)) {
          didEraseSomething = true;
        }
        return;
      }

      const pt = get3DPoint(e);
      if (!pt || !strokeStartPt) return;
      const pressure = (e.pointerType === 'pen' && e.pressure > 0) ? e.pressure : 0.55;

      // MODO 1: MURO / RECTÁNGULO CON HATCH
      if (tool === 'rect-hatch') {
        const [u1, v1] = toPlane2D(strokeStartPt, currentPlaneType);
        const [u2, v2] = toPlane2D(pt, currentPlaneType);
        if (Math.abs(u2 - u1) < 0.04 && Math.abs(v2 - v1) < 0.04) return;

        const rectPoly = [
          [u1, v1],
          [u2, v1],
          [u2, v2],
          [u1, v2]
        ];

        clearLivePreview();
        pendingHatchElements = buildHatchElements(
          rectPoly, currentPlaneType, planeOffset,
          hatchMode, hatchSpacing, currentColor, currentStrokeSize
        );
        livePreviewGroup = new THREE.Group();
        pendingHatchElements.forEach(el => {
          el.mesh = (el.type === 'fill') ? createFillMesh(el) : createStrokeMesh(el);
          livePreviewGroup.add(el.mesh);
        });
        scene.add(livePreviewGroup);
        return;
      }

      // MODO 2: POLÍGONO LIBRE CON HATCH
      if (tool === 'poly-hatch') {
        const last = rawPoints[rawPoints.length - 1];
        const distSq = (last.x - pt.x)**2 + (last.y - pt.y)**2 + (last.z - pt.z)**2;
        if (distSq > 0.02) {
          rawPoints.push({ x: pt.x, y: pt.y, z: pt.z, pressure });
        }
        if (rawPoints.length < 3) return;

        const poly2D = rawPoints.map(p => toPlane2D(p, currentPlaneType));
        clearLivePreview();
        pendingHatchElements = buildHatchElements(
          poly2D, currentPlaneType, planeOffset,
          hatchMode, hatchSpacing, currentColor, currentStrokeSize
        );
        livePreviewGroup = new THREE.Group();
        pendingHatchElements.forEach(el => {
          el.mesh = (el.type === 'fill') ? createFillMesh(el) : createStrokeMesh(el);
          livePreviewGroup.add(el.mesh);
        });
        scene.add(livePreviewGroup);
        return;
      }

      // MODO 3: LÁPIZ BOCETO Y PLUMA TINTA
      if (straightMode) {
        // El punto inicial permanece 100% fijo en strokeStartPt y el final en pt
        const distSq = (strokeStartPt.x - pt.x)**2 + (strokeStartPt.y - pt.y)**2 + (strokeStartPt.z - pt.z)**2;
        if (distSq < 0.0004) return;
        rawPoints = [
          { ...strokeStartPt },
          { x: pt.x, y: pt.y, z: pt.z, pressure }
        ];
      } else {
        const last = rawPoints[rawPoints.length - 1];
        const distSq = (last.x - pt.x)**2 + (last.y - pt.y)**2 + (last.z - pt.z)**2;
        if (distSq > 0.008) {
          rawPoints.push({ x: pt.x, y: pt.y, z: pt.z, pressure });
        }
      }

      if (rawPoints.length < 2) return;
      clearLivePreview();
      const previewObj = {
        type: 'stroke',
        style: (tool === 'pen') ? 'pen' : 'pencil',
        color: currentColor,
        size: currentStrokeSize,
        normal: getPlaneNormalObj(currentPlaneType),
        points: rawPoints
      };
      livePreviewGroup = createStrokeMesh(previewObj);
      scene.add(livePreviewGroup);
    });

    function endInteraction(e) {
      if (e.pointerType === 'touch') {
        activeTouches = Math.max(0, activeTouches - 1);
      }
      updateEraserCursor(0, 0, false);

      if (isInteracting) {
        isInteracting = false;

        if (tool === 'eraser') {
          if (didEraseSomething) autoSaveLocal();
          didEraseSomething = false;
        } else if ((tool === 'rect-hatch' || tool === 'poly-hatch') && pendingHatchElements.length > 0) {
          pushUndoState();
          clearLivePreview();
          pendingHatchElements.forEach(el => {
            el.mesh = (el.type === 'fill') ? createFillMesh(el) : createStrokeMesh(el);
            scene.add(el.mesh);
            strokesData.push(el);
          });
          pendingHatchElements = [];
          autoSaveLocal();
        } else if (livePreviewGroup && rawPoints.length >= 2) {
          pushUndoState();
          const cleanPts = straightMode ? [...rawPoints] : simplifyPoints(rawPoints);
          const finalStroke = {
            type: 'stroke',
            style: (tool === 'pen') ? 'pen' : 'pencil',
            color: currentColor,
            size: currentStrokeSize,
            normal: getPlaneNormalObj(currentPlaneType),
            points: cleanPts,
            mesh: livePreviewGroup
          };
          strokesData.push(finalStroke);
          livePreviewGroup = null;
          autoSaveLocal();
        }
        rawPoints = [];
        strokeStartPt = null;
      }
      controls.enabled = true;
    }

    renderer.domElement.addEventListener('pointerup', endInteraction);
    renderer.domElement.addEventListener('pointercancel', endInteraction);

    // --- BOTONES DE HERRAMIENTAS, HATCH, GROSOR, IMÁN Y COLORES ---
    const btnPencil = document.getElementById('btn-pencil');
    const btnPen = document.getElementById('btn-pen');
    const btnRectHatch = document.getElementById('btn-rect-hatch');
    const btnPolyHatch = document.getElementById('btn-poly-hatch');
    const btnEraser = document.getElementById('btn-eraser');
    const btnOrbit = document.getElementById('btn-orbit');

    const hatchOptionsBox = document.getElementById('hatch-options');
    const eraserSizeBox = document.getElementById('eraser-size-box');
    const eraserSlider = document.getElementById('eraser-slider');
    const eraserLbl = document.getElementById('eraser-lbl');
    const strokeSizeSlider = document.getElementById('stroke-size-slider');
    const strokeSizeLbl = document.getElementById('stroke-size-lbl');
    const hatchSpaceSlider = document.getElementById('hatch-space-slider');
    const hatchSpaceLbl = document.getElementById('hatch-space-lbl');

    function setTool(selected) {
      tool = selected;
      btnPencil.classList.toggle('active', tool === 'pencil');
      btnPen.classList.toggle('active', tool === 'pen');
      btnRectHatch.classList.toggle('active', tool === 'rect-hatch');
      btnPolyHatch.classList.toggle('active', tool === 'poly-hatch');
      btnEraser.classList.toggle('active', tool === 'eraser');
      btnOrbit.classList.toggle('active', tool === 'orbit');

      eraserSizeBox.classList.toggle('visible', tool === 'eraser');
      hatchOptionsBox.classList.toggle('visible', tool === 'rect-hatch' || tool === 'poly-hatch');
      if (tool === 'eraser' || tool === 'orbit') snapMarker.visible = false;
    }

    btnPencil.addEventListener('click', () => setTool('pencil'));
    btnPen.addEventListener('click', () => setTool('pen'));
    btnRectHatch.addEventListener('click', () => setTool('rect-hatch'));
    btnPolyHatch.addEventListener('click', () => setTool('poly-hatch'));
    btnEraser.addEventListener('click', () => setTool('eraser'));
    btnOrbit.addEventListener('click', () => setTool('orbit'));

    // Estilos de Hatch
    const hatchStyleBtns = document.querySelectorAll('.hatch-style-btn');
    hatchStyleBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        hatchStyleBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        hatchMode = btn.getAttribute('data-hmode');
      });
    });

    hatchSpaceSlider.addEventListener('input', (e) => {
      hatchSpacing = parseFloat(e.target.value);
      hatchSpaceLbl.textContent = hatchSpacing.toFixed(2) + ' m';
    });

    // Grosor de Lápiz / Pluma
    strokeSizeSlider.addEventListener('input', (e) => {
      currentStrokeSize = parseFloat(e.target.value);
      strokeSizeLbl.textContent = currentStrokeSize.toFixed(1) + 'x';
    });

    // Tamaño del Borrador
    eraserSlider.addEventListener('input', (e) => {
      eraserRadiusPx = parseInt(e.target.value, 10);
      eraserLbl.textContent = eraserRadiusPx + ' px';
    });

    // Selección de Color
    const swatches = document.querySelectorAll('.color-swatch');
    const customColorInput = document.getElementById('custom-color');

    swatches.forEach(btn => {
      btn.addEventListener('click', () => {
        swatches.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentColor = btn.getAttribute('data-color');
        if (tool === 'eraser' || tool === 'orbit') setTool('pencil');
      });
    });

    customColorInput.addEventListener('input', (e) => {
      swatches.forEach(b => b.classList.remove('active'));
      currentColor = e.target.value;
      if (tool === 'eraser' || tool === 'orbit') setTool('pencil');
    });

    // Asistencia, Imán y Edición
    const btnStraight = document.getElementById('btn-straight');
    const btnSnap = document.getElementById('btn-snap');
    const snapStepBox = document.getElementById('snap-step-box');
    const snapStepBtns = document.querySelectorAll('.snap-step-btn');
    const btnUndo = document.getElementById('btn-undo');
    const btnClear = document.getElementById('btn-clear');

    btnStraight.addEventListener('click', () => {
      straightMode = !straightMode;
      btnStraight.classList.toggle('secondary-active', straightMode);
    });

    btnSnap.addEventListener('click', () => {
      snapToGrid = !snapToGrid;
      btnSnap.classList.toggle('secondary-active', snapToGrid);
      snapStepBox.style.display = snapToGrid ? 'flex' : 'none';
      if (!snapToGrid) snapMarker.visible = false;
    });

    snapStepBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        snapStepBtns.forEach(b => b.classList.remove('secondary-active'));
        btn.classList.add('secondary-active');
        snapStep = parseFloat(btn.getAttribute('data-step'));
      });
    });

    btnUndo.addEventListener('click', () => {
      if (undoStack.length === 0) return;
      const prevArray = undoStack.pop();
      syncSceneWithStrokesArray(prevArray);
      autoSaveLocal();
    });

    btnClear.addEventListener('click', () => {
      if (strokesData.length === 0) return;
      pushUndoState();
      syncSceneWithStrokesArray([]);
      autoSaveLocal();
    });

    // --- PLANOS ESTRUCTURALES 3D Y CONTROL DE TAMAÑO DE GRILLA ---
    const plXZ = document.getElementById('pl-xz');
    const plXY = document.getElementById('pl-xy');
    const plYZ = document.getElementById('pl-yz');
    const planeSlider = document.getElementById('plane-slider');
    const planeVal = document.getElementById('plane-val');
    const gridSizeSlider = document.getElementById('grid-size-slider');
    const gridSizeLbl = document.getElementById('grid-size-lbl');

    function rebuildGrids(size) {
      currentGridSize = size;
      gridSizeLbl.textContent = `${size}x${size} m`;

      scene.remove(floorGrid);
      floorGrid = new THREE.GridHelper(
        size + 4, size + 4,
        isLightMode ? 0x2563eb : 0x3b82f6,
        isLightMode ? 0xd6d3cd : 0x262930
      );
      scene.add(floorGrid);
      axesHelper.position.set(-(size / 2 + 2), 0.01, -(size / 2 + 2));

      activeGridGroup.remove(activeGrid);
      activeGrid = new THREE.GridHelper(size, size, 0x60a5fa, 0x334155);
      activeGrid.material.transparent = true;
      activeGrid.material.opacity = 0.45;
      activeGridGroup.add(activeGrid);

      activePlaneMesh.geometry.dispose();
      const newPlaneGeo = new THREE.PlaneGeometry(size, size);
      newPlaneGeo.rotateX(-Math.PI / 2);
      activePlaneMesh.geometry = newPlaneGeo;

      const half = size / 2;
      planeSlider.min = -half;
      planeSlider.max = half;
      if (planeOffset > half || planeOffset < -half) {
        planeOffset = 0;
        planeSlider.value = 0;
        planeVal.textContent = '0.0 m';
        updateWorkingPlane();
      }
    }

    gridSizeSlider.addEventListener('input', (e) => {
      rebuildGrids(parseInt(e.target.value, 10));
    });

    function selectPlane(type) {
      currentPlaneType = type;
      plXZ.classList.toggle('active', type === 'XZ');
      plXY.classList.toggle('active', type === 'XY');
      plYZ.classList.toggle('active', type === 'YZ');
      updateWorkingPlane();
    }

    plXZ.addEventListener('click', () => selectPlane('XZ'));
    plXY.addEventListener('click', () => selectPlane('XY'));
    plYZ.addEventListener('click', () => selectPlane('YZ'));

    planeSlider.addEventListener('input', (e) => {
      planeOffset = parseFloat(e.target.value);
      planeVal.textContent = planeOffset.toFixed(1) + ' m';
      updateWorkingPlane();
    });

    // --- MODO CLARO / OSCURO ---
    const btnTheme = document.getElementById('btn-theme');
    btnTheme.addEventListener('click', () => {
      isLightMode = !isLightMode;
      document.body.classList.toggle('light-mode', isLightMode);
      btnTheme.textContent = isLightMode ? '🌙 Oscuro' : '☀️ Claro';

      scene.background = new THREE.Color(isLightMode ? 0xf4f1ea : 0x141619);
      rebuildGrids(currentGridSize);

      if (isLightMode && currentColor === '#e2e8f0') {
        swatches[1].click();
      } else if (!isLightMode && currentColor === '#1e293b') {
        swatches[0].click();
      }
    });

    // --- SISTEMA DE GUARDADO DE PROYECTOS OPTIMIZADO ---
    const modalOverlay = document.getElementById('modal-overlay');
    const btnProjects = document.getElementById('btn-projects');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const btnSaveProject = document.getElementById('btn-save-project');
    const projectNameInput = document.getElementById('project-name-input');
    const projectListEl = document.getElementById('project-list');
    const currentWeightLbl = document.getElementById('current-weight-lbl');
    const btnExportJson = document.getElementById('btn-export-json');
    const btnImportJson = document.getElementById('btn-import-json');
    const btnExportPng = document.getElementById('btn-export-png');
    const fileInput = document.getElementById('file-input');

    const STORAGE_KEY = 'croquis3d_saved_projects';

    function getSavedProjects() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      } catch (e) {
        return {};
      }
    }

    function updateWeightIndicator() {
      const jsonStr = serializeStrokes();
      const kb = (jsonStr.length / 1024).toFixed(1);
      currentWeightLbl.textContent = `${kb} KB (Optimizado ⚡)`;
    }

    function renderProjectList() {
      updateWeightIndicator();
      const projects = getSavedProjects();
      const names = Object.keys(projects);
      projectListEl.innerHTML = '';

      if (names.length === 0) {
        projectListEl.innerHTML = '<div style="color:var(--text-muted);font-size:12px;padding:6px;">Aún no tienes proyectos guardados con nombre.</div>';
        return;
      }

      names.forEach(name => {
        const item = document.createElement('div');
        item.className = 'project-item';
        const info = document.createElement('div');
        info.innerHTML = `<strong>${name}</strong><br><span style="font-size:11px;color:var(--text-muted);">${projects[name].date || ''}</span>`;

        const actions = document.createElement('div');
        actions.className = 'project-actions';

        const loadBtn = document.createElement('button');
        loadBtn.textContent = 'Abrir';
        loadBtn.className = 'active';
        loadBtn.style.padding = '6px 10px';
        loadBtn.onclick = () => {
          pushUndoState();
          rebuildAllMeshesFromData(projects[name].strokes || []);
          autoSaveLocal();
          modalOverlay.classList.remove('open');
        };

        const delBtn = document.createElement('button');
        delBtn.textContent = '🗑️';
        delBtn.className = 'danger';
        delBtn.style.padding = '6px 9px';
        delBtn.onclick = () => {
          const all = getSavedProjects();
          delete all[name];
          localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
          renderProjectList();
        };

        actions.appendChild(loadBtn);
        actions.appendChild(delBtn);
        item.appendChild(info);
        item.appendChild(actions);
        projectListEl.appendChild(item);
      });
    }

    btnProjects.addEventListener('click', () => {
      renderProjectList();
      modalOverlay.classList.add('open');
    });

    btnCloseModal.addEventListener('click', () => {
      modalOverlay.classList.remove('open');
    });

    btnSaveProject.addEventListener('click', () => {
      const name = projectNameInput.value.trim() || ('Croquis ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));
      const all = getSavedProjects();
      all[name] = {
        date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
        strokes: JSON.parse(serializeStrokes())
      };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
      } catch (err) {
        alert('Memoria interna llena. Usa "Bajar Archivo" para guardar en tu iPad.');
      }
      projectNameInput.value = '';
      renderProjectList();
    });

    btnExportJson.addEventListener('click', () => {
      const jsonStr = serializeStrokes();
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'proyecto_croquis3d.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    });

    btnImportJson.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          pushUndoState();
          rebuildAllMeshesFromData(parsed);
          autoSaveLocal();
          modalOverlay.classList.remove('open');
        } catch (err) {
          alert('El archivo no tiene un formato válido.');
        }
      };
      reader.readAsText(file);
      fileInput.value = '';
    });

    btnExportPng.addEventListener('click', () => {
      const prevVis = snapMarker.visible;
      snapMarker.visible = false;
      renderer.render(scene, camera);
      snapMarker.visible = prevVis;
      renderer.domElement.toBlob((blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'croquis_3d.png';
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      }, 'image/png');
    });

    window.addEventListener('DOMContentLoaded', () => {
      try {
        const saved = localStorage.getItem('croquis3d_autosave');
        if (saved) {
          rebuildAllMeshesFromData(JSON.parse(saved));
          autoSaveLocal();
        }
      } catch (e) {}
    });

    // --- LOOP DE RENDERIZADO Y RESIZE ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
